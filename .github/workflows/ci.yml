# The translation files are checked on every push and pull request. Nothing is built or published:
# the pods fetch a pinned commit of this repository as files.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/check.sh
      - run: node --test scripts/check-translations.test.mjs
